<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROADGUARD</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@500;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- START SCREEN -->
<section id="start">

  <div class="hs">

    <div class="stage" id="stage">

      <div class="slide on" data-s="0">
        <img src="assets/img/s1.jpg" alt="" class="kb">
        <div class="ov">
          <div class="tag" style="left:20%;top:16%">
            <span class="dot blink"></span>CAM-01 · ONLINE
          </div>
          <div class="tag" style="left:47%;top:34%">CAM-02 · ONLINE</div>
          <div class="tag" style="left:44%;top:62%">PTZ · TRACKING</div>
        </div>
      </div>

      <div class="slide" data-s="1">
        <img src="assets/img/s2.jpg" alt="" class="kb">
        <div class="ov" id="tracks"></div>
      </div>

      <div class="slide" data-s="2">
        <img src="assets/img/s3.jpg" alt="" class="kb">
        <div class="ov">
          <div class="rbox below" style="left:36.5%;top:3%;width:62.5%;height:52%">
            <b data-t="ovCrash"></b>
          </div>
        </div>
      </div>

      <div class="slide" data-s="3">
        <img src="assets/img/s4.jpg" alt="" class="kb">
        <div class="ov">
          <div class="wbox" style="left:26.5%;top:46%;width:14%;height:26%">
            <b data-t="ovEta"></b>
          </div>
        </div>
      </div>

    </div>

    <div class="grade"></div>

    <!-- TOP BAR -->
    <div class="topbar">

      <a class="logo" href="#start">
        <i>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="#fff" stroke-width="2.4" aria-hidden="true">
            <path d="M12 3v18M5 21l3-18M19 21l-3-18"/>
          </svg>
        </i>
        ROADGUARD
      </a>

      <div class="row" style="align-items:center;flex-wrap:nowrap">
        <span class="live">
          <span class="dot blink"></span>
          <span data-t="liveNow"></span>
        </span>

        <button class="btn small" type="button"
          data-login="staff" data-t="login"></button>

        <button class="lang" type="button" data-lang
          aria-label="Switch language">EN</button>
      </div>

    </div>

    <!-- HERO -->
    <div class="hero">

      <div class="hero-in">

        <div class="kicker">
          <span data-t="kicker"></span>
        </div>

        <h1>
          <span class="ln"><span data-t="h1a"></span></span>
          <span class="ln"><span class="red" data-t="h1b"></span></span>
        </h1>

        <p data-t="heroText"></p>

        <div class="row">
          <button class="btn" type="button"
            data-login="staff" data-t="enter"></button>
        </div>

      </div>

      <ol class="story" id="story">
        <li>
          <button type="button" data-go-s="0">
            <i><u></u></i>
            <span data-t="sy1"></span>
          </button>
        </li>

        <li>
          <button type="button" data-go-s="1">
            <i><u></u></i>
            <span data-t="sy2"></span>
          </button>
        </li>

        <li>
          <button type="button" data-go-s="2">
            <i><u></u></i>
            <span data-t="sy3"></span>
          </button>
        </li>

        <li>
          <button type="button" data-go-s="3">
            <i><u></u></i>
            <span data-t="sy4"></span>
          </button>
        </li>
      </ol>

    </div>

    <a class="scrollhint" href="#how" data-t="more"></a>

  </div>

  <footer>
    <span>ROADGUARD · RoadResQ</span>
    <span data-t="foot"></span>
  </footer>

</section>


<!-- STAFF LOGIN -->
<div class="modal hidden" id="login"
  role="dialog" aria-modal="true" aria-labelledby="loginT">

  <form class="mbox" id="loginForm">

    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <h2 id="loginT" style="font-size:28px" data-t="login"></h2>

      <button type="button" class="x" id="closeLogin"
        aria-label="close">✕</button>
    </div>

    <div id="fStaff">

      <label>
        <span data-t="empId"></span>
        <input name="emp" required autocomplete="off" inputmode="numeric">
      </label>

      <label>
        <span data-t="pass"></span>
        <input name="pw" type="password" required autocomplete="off">
      </label>

    </div>

    <button class="btn" type="submit"
      style="width:100%" data-t="signIn"></button>

    <p class="note" data-t="loginDemo"></p>

  </form>

</div>


<!-- OPERATIONS APP -->
<div id="app" class="hidden">

  <header class="app">

    <a class="logo" href="#start">
      <i>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="#fff" stroke-width="2.4" aria-hidden="true">
          <path d="M12 3v18M5 21l3-18M19 21l-3-18"/>
        </svg>
      </i>
      ROADGUARD
    </a>

    <nav class="tabs" aria-label="sections">
      <button type="button" data-tab="live" data-t="tLive"></button>
      <button type="button" data-tab="map" data-t="tMap"></button>
      <button type="button" data-tab="incidents" data-t="tInc"></button>
      <button type="button" data-tab="upload" data-t="tUp"></button>
    </nav>

    <div class="row" style="align-items:center;flex-wrap:nowrap">
      <span class="note" id="roleBadge"></span>

      <button class="lang" type="button"
        id="logout" data-t="logout"></button>

      <button class="lang" type="button"
        data-lang aria-label="Switch language">EN</button>
    </div>

  </header>


  <main>

    <!-- LIVE MONITORING -->
    <section id="v-live">

      <div class="title">
        <h2 data-t="liveTitle"></h2>
        <span class="note" data-t="demo"></span>
      </div>

      <div class="cams" id="cams"></div>

      <div class="grid2">

        <div class="panel">

          <div class="feed">

            <video id="feedVid"
              src="assets/video/cam01.mp4"
              autoplay muted loop playsinline preload="auto">
            </video>

            <div class="box">
              <b>CRASH · p=0.87</b>
            </div>

            <div class="hud" style="top:12px;right:12px">
              <span class="dot blink"></span>
              LIVE · CAM-01
            </div>

            <div class="hud" style="bottom:12px;left:12px" id="clock">
              --:--:--
            </div>

            <div class="hud" style="top:12px;left:12px">
              AI · <span data-t="aiOn"></span>
            </div>

          </div>

        </div>


        <div class="panel pad">

          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">

            <div>
              <h3 style="font-size:26px" data-t="incType"></h3>
              <div class="note" style="margin-top:6px" data-t="incWhere"></div>
            </div>

            <span class="chip sev2" id="sevBadge" data-t="sev2"></span>

          </div>

          <div class="kv">

            <div>
              <span data-t="kTime"></span>
              <strong class="t">14:32:07</strong>
            </div>

            <div>
              <span data-t="kCam"></span>
              <strong>CAM-01</strong>
            </div>

            <div>
              <span data-t="kCars"></span>
              <strong id="carsVal">2</strong>
            </div>

            <div>
              <span data-t="kSpeed"></span>
              <strong data-t="speedVal"></strong>
            </div>

          </div>

          <strong data-t="unitsTitle"></strong>

          <div class="units" id="units"></div>

          <p class="note" id="quickAdvice" style="margin:10px 0 14px"></p>

          <button class="btn ghost" type="button"
            style="width:100%"
            data-go="map" data-t="showRoute"></button>

        </div>

      </div>

    </section>


    <!-- JORDAN MAP -->
    <section id="v-map" class="hidden">

      <div class="title">
        <h2 data-t="mapTitle"></h2>
        <span class="note" data-t="mapNote"></span>
      </div>

      <div class="grid2">

        <div class="mapwrap">
          <div id="map" role="region" aria-label="Jordan map"></div>
        </div>

        <div class="panel pad">

          <strong data-t="fromTitle"></strong>

          <div class="stations" id="stations"></div>

          <strong data-t="routesTitle"></strong>

          <div id="routes" style="margin-top:10px"></div>

          <button class="btn" type="button"
            id="goBtn" style="width:100%" data-t="startNav"></button>

          <div class="legend">

            <span>
              <svg width="28" height="8" aria-hidden="true">
                <line x1="0" y1="4" x2="28" y2="4"
                  stroke="#2FBF71" stroke-width="5"/>
              </svg>
              <span data-t="tr0"></span>
            </span>

            <span>
              <svg width="28" height="8" aria-hidden="true">
                <line x1="0" y1="4" x2="28" y2="4"
                  stroke="#F07A1A" stroke-width="5"
                  stroke-dasharray="7 4"/>
              </svg>
              <span data-t="tr1"></span>
            </span>

            <span>
              <svg width="28" height="8" aria-hidden="true">
                <line x1="0" y1="4" x2="28" y2="4"
                  stroke="#E3242B" stroke-width="5"
                  stroke-dasharray="3 3"/>
              </svg>
              <span data-t="tr2"></span>
            </span>

          </div>

        </div>

      </div>

    </section>


    <!-- INCIDENT RECORDS -->
    <section id="v-incidents" class="hidden">

      <div class="title">
        <h2 data-t="incTitle"></h2>
        <span class="note" data-t="demo"></span>
      </div>

      <div class="grid2">

        <div class="panel" style="overflow-x:auto">

          <table>
            <thead>
              <tr>
                <th data-t="thTime"></th>
                <th data-t="thPlace"></th>
                <th data-t="thType"></th>
                <th data-t="thSev"></th>
                <th class="hide-sm" data-t="thStatus"></th>
              </tr>
            </thead>

            <tbody id="incRows"></tbody>
          </table>

        </div>

        <div class="panel pad" id="incDetail"></div>

      </div>

    </section>


    <!-- VIDEO ANALYSIS -->
    <section id="v-upload" class="hidden">

      <div class="title">
        <h2 data-t="upTitle"></h2>
        <span class="note" data-t="demo"></span>
      </div>

      <div class="panel pad">

        <label class="drop" for="file">

          <svg width="44" height="44" viewBox="0 0 24 24"
            fill="none" stroke="#fff" stroke-width="1.6"
            aria-hidden="true">
            <path d="M12 16V4M6 10l6-6 6 6M4 20h16"/>
          </svg>

          <strong style="font-size:20px" data-t="upPick"></strong>

          <span class="note" data-t="upHint"></span>

          <span class="btn" data-t="upBtn"></span>

        </label>

        <input id="file" type="file"
          accept="video/*" class="hidden">

        <div id="upState" style="margin-top:20px"></div>

      </div>

    </section>

  </main>


  <footer>
    <span>ROADGUARD · RoadResQ</span>
    <span data-t="foot"></span>
  </footer>

</div>


<div id="toast" class="hidden" role="status"></div>

<script src="js/jordan-data.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/app.js"></script>

</body>
</html>
